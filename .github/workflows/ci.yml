name: CI & Notify Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, Test & Build Blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run prose & schema checks
        run: bun test
      - name: Build static blog & Markdown exports
        run: bun run build
      - name: Trigger culpritsql.com deployment on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "SITE_DISPATCH_TOKEN not configured; culpritsql/culprit-sql-studio site.yml can also be triggered directly."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/culpritsql/culprit-sql-studio/dispatches \
            -d '{"event_type":"blog-updated"}'
