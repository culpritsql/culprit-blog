name: CI & Notify Site

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [upstream-pkg-published]
  schedule:
    - cron: "39 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Typecheck, Test & Build Blog
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[skip ci]'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: deps
        name: Install & sync @culpritsql dependencies
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bun install --frozen-lockfile
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PLANS_LATEST="$(npm view @culpritsql/plans version)"
          VIEWER_LATEST="$(npm view @culpritsql/plan-viewer version)"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@culpritsql/plans"] = `^${process.argv[1]}`;
            pkg.dependencies["@culpritsql/plan-viewer"] = `^${process.argv[2]}`;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$PLANS_LATEST" "$VIEWER_LATEST"
          bun install --no-cache

          if [ "$EVENT_NAME" = "schedule" ] && git diff --quiet -- package.json bun.lock; then
            echo "No upstream @culpritsql updates on schedule; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - name: Typecheck Astro & TypeScript
        if: steps.deps.outputs.should_run == 'true'
        run: bun run typecheck
      - name: Run prose & schema checks
        if: steps.deps.outputs.should_run == 'true'
        run: bun test
      - name: Build static blog & Markdown exports
        if: steps.deps.outputs.should_run == 'true'
        run: bun run build
      - name: Commit updated @culpritsql lockfile on main
        if: steps.deps.outputs.should_run == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            exit 0
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"

          git config user.name "culprit-bot"
          git config user.email "noreply@culpritsql.com"
          git add package.json bun.lock
          git commit -m "chore(deps): sync @culpritsql packages [skip ci]"
          git push origin HEAD:main || true
      - name: Trigger culpritsql.com deployment
        if: steps.deps.outputs.should_run == 'true' && github.event_name != 'pull_request'
        env:
          DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "SITE_DISPATCH_TOKEN not configured; culpritsql/culprit-sql-studio site.yml is triggered directly by package sync."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/culpritsql/culprit-sql-studio/dispatches \
            -d '{"event_type":"blog-updated"}'
